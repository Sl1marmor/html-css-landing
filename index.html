<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>DJI Mini 3 Pro</title>

  <!-- шрифт Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- стилі розбиті по частинах -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div class="wrapper">
    <div class="page">

      <!-- шапка сайту -->
      <header class="header">
        <div class="logo">DGB</div>

        <nav class="menu">
          <a class="menu-link" href="#">Home</a>
          <a class="menu-link" href="#">About us</a>
          <a class="menu-link" href="#">Product</a>
          <a class="menu-link" href="#">Contacts</a>

          <a class="cart" href="#">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
              <path d="M5 4a3 3 0 0 1 6 0h1.5A1.5 1.5 0 0 1 14 5.5v7A2.5 2.5 0 0 1 11.5 15h-7A2.5 2.5 0 0 1 2 12.5v-7A1.5 1.5 0 0 1 3.5 4H5zm1.5 0h3a1.5 1.5 0 0 0-3 0z"/>
            </svg>
          </a>
        </nav>
      </header>

      <!-- головний блок -->
      <main class="hero">

        <div class="hero-image">
          <p class="hero-bg-text">DRONE</p>
          <img class="hero-drone" src="img/drone.png" alt="DJI Mini 3 Pro">
        </div>

        <div class="hero-info">
          <h1 class="hero-title">DJI Mini 3 Pro</h1>
          <p class="hero-text">Lorem Ipsum Is Simply Dummy Text Of The Printing And Typesetting Industry. Lorem Ipsum</p>
          <button class="hero-button">Buy now</button>
        </div>

        <!-- справа "slide" -->
        <div class="slide">
          <span class="slide-text">SLIDE</span>
          <div class="slide-play"></div>
          <div class="slide-line"></div>
          <span class="slide-text">TAP TO PLAY</span>
        </div>

      </main>

    </div>
  </div>
</body>
</html>
